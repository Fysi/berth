<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>Button</title><style>html,body{margin:0}body{padding:16px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:16px}</style></head>
<body class="bt-page" style="background:var(--concrete)">
<div class="row">
  <button class="bt-btn bt-btn--primary" type="button">Vouch and land <span class="bt-kbd">V</span></button>
  <button class="bt-btn" type="button">Build on this <span class="bt-kbd">B</span></button>
  <button class="bt-btn bt-btn--danger" type="button">Stop attempt</button>
  <button class="bt-btn bt-btn--quiet" type="button">Open agent record</button>
  <button class="bt-btn" type="button" disabled>Land (needs a vouch)</button>
</div>
</body>
</html>
