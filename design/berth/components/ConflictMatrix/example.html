<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>ConflictMatrix</title><style>html,body{margin:0}body{padding:16px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.stack{display:grid;gap:16px}</style></head>
<body class="bt-page" style="background:var(--concrete)">
<div class="bt-matrix-wrap">
<table class="bt-matrix">
  <caption class="bt-label" style="text-align:left;padding-bottom:8px">Conflicts · updated 12 s after the last push</caption>
  <thead><tr><th scope="col">Attempt</th><th scope="col" class="is-trunk">Trunk</th><th scope="col">1</th><th scope="col">2</th><th scope="col">3</th></tr></thead>
  <tbody>
    <tr><th scope="row">Attempt 1</th><td class="is-clean">Clean</td><td class="is-self">—</td><td class="is-overlap">Same lines, merges</td><td class="is-conflict">Conflict · 2 files</td></tr>
    <tr><th scope="row">Attempt 2</th><td class="is-clean">Clean</td><td class="is-overlap">Same lines, merges</td><td class="is-self">—</td><td class="is-clean">Clean</td></tr>
    <tr><th scope="row">Attempt 3</th><td class="is-conflict">Conflict · 1 file</td><td class="is-conflict">Conflict · 2 files</td><td class="is-clean">Clean</td><td class="is-self">—</td></tr>
  </tbody>
</table>
</div>
</body>
</html>
